<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explosion Book - 4 quadrati + 12 triangoli</title>

  <style>
    * { box-sizing: border-box; }

    body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
  overflow: hidden;
  position: relative;

  background-image: url('sfondo muro v.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #efd8cf;
}

    .scene {
      width: min(96vw, 1200px);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1800px;
    }

    .book {
      --s: min(15.5vw, 145px);
      width: calc(var(--s) * 6.2);
      height: calc(var(--s) * 6.2);
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform .34s cubic-bezier(.22,.85,.18,1), opacity .16s ease, filter .16s ease;
    }

    .book.open {
      transform: scale(1.12) rotateX(4deg) rotateZ(-2deg) translateX(-2vw);
    }

    .square,
    .triangle,
    .cover {
      position: absolute;
      width: var(--s);
      height: var(--s);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      border: 2px solid rgba(55,35,28,.55);
      box-shadow: 0 12px 24px rgba(0,0,0,.16);
      backface-visibility: hidden;
      transition:
        transform .34s cubic-bezier(.22,.85,.18,1),
        opacity .16s ease,
        filter .16s ease;
      overflow: hidden;
    }

    .square::after,
    .triangle::after,
    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.42), rgba(0,0,0,.05));
      pointer-events: none;
    }

    .square span,
    .triangle span,
    .cover strong {
      position: relative;
      z-index: 2;
      font-weight: 700;
      line-height: 1.08;
    }

    .square img {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: white;
      padding: 0;
    }

    .has-slide,
    .has-slide-small {
      background: #ffffff !important;
      overflow: hidden;
      padding: 0;
    }

    .has-slide {
      background: #ffffff !important;
      overflow: hidden;
      padding: 0;
    }

    .has-slide img,
    .has-slide-small img {
      box-shadow: 0 6px 16px rgba(0,0,0,.18);
    }

    .has-slide img {
      box-shadow: 0 6px 16px rgba(0,0,0,.18);
    }

    /*
      La slide 16:9 dentro un quadrato si vede intera ma piccola.
      Quando l'explosion book è aperto, il quadrato centrale si ingrandisce
      per rendere leggibile la slide senza tagliarla.
    */
    .book.open .has-slide {
      transform: translate(0,0) rotateX(0) rotateY(0) scale(1.15);
      z-index: 35;
    }

    /*
      Adattamento migliore per immagini verticali o fotografie di slide.
      L'immagine sfrutta più spazio interno senza deformarsi.
    */
    .has-slide img,
    .has-slide-small img {
      max-width: 100%;
      max-height: 100%;
      transform: scale(1.08);
      transform-origin: center;
    }

    /*
      GEOMETRIA:
      4 quadrati principali in diagonale.
      Ogni quadrato tocca il successivo solo per un angolo.

      q1
         q2
            q3
               q4

      I 12 triangoli sono organizzati in 6 coppie.
      Ogni coppia di triangoli colma uno spazio vuoto e forma visivamente un nuovo quadrato.
    */

    .q1 { left: calc(var(--s) * 0.6); top: calc(var(--s) * 0.6); background: #ffe29a; z-index: 20; }
    .q2 { left: calc(var(--s) * 1.6); top: calc(var(--s) * 1.6); background: #d8f0ff; z-index: 22; }
    .q3 { left: calc(var(--s) * 2.6); top: calc(var(--s) * 2.6); background: #f5b7aa; z-index: 24; }
    .q4 { left: calc(var(--s) * 3.6); top: calc(var(--s) * 3.6); background: #d9f4df; z-index: 26; }

    /* Stato chiuso: tutti ripiegati sul quadrato q3, come un artefatto chiuso */
    .q1 { transform-origin: 100% 100%; transform: translate(calc(var(--s) * 2), calc(var(--s) * 2)) rotateX(-130deg) rotateY(35deg); }
    .q2 { transform-origin: 100% 100%; transform: translate(var(--s), var(--s)) rotateX(-120deg) rotateY(25deg); }
    .q3 { transform: translate(0,0); }
    .q4 { transform-origin: 0% 0%; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateX(120deg) rotateY(-25deg); }

    .book.open .q1,
    .book.open .q2,
    .book.open .q3,
    .book.open .q4 {
      transform: translate(0,0) rotateX(0) rotateY(0);
    }

    .triangle {
      background: rgba(255,248,237,0.88);
      opacity: 0;
      font-size: 12px;
      z-index: 18;
      border: 2px solid rgba(55,35,28,.55);
    }

    /*
      Linea di piega/diagonale: rende leggibile che ogni quadrato intermedio
      è composto da due triangoli distinti.
    */
    .triangle::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
        transparent calc(50% - 0.5px),
        rgba(70, 45, 35, .20) calc(50% - 0.5px),
        rgba(70, 45, 35, .20) calc(50% + 0.5px),
        transparent calc(50% + 0.5px)
      );
      z-index: 1;
      pointer-events: none;
    }

    .book.open .triangle {
      opacity: 1;
      transition-delay: 0s;
    }

    /*
      Evidenzia meglio i triangoli sopra le slide.
    */
    .triangle span {
      font-size: 11px;
      color: #5a3425;
      font-weight: bold;
    }

    /*
      Mini-slide nei triangoli: le immagini vengono incollate dentro il frame
      triangolare e ritagliate dal clip-path del triangolo.
    */
    .triangle.has-triangle-slide {
      background: #ffffff;
      padding: 4px;
      overflow: hidden;
      border: 2px solid rgba(55,35,28,.55);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.85), 0 12px 24px rgba(0,0,0,.16);
    }

    .triangle.has-triangle-slide img {
      position: absolute;
      inset: 5%;
      width: 90%;
      height: 90%;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 0;
      filter: saturate(1.05) contrast(1.03);
      border: 2px solid rgba(255,255,255,.9);
      box-shadow: 0 3px 8px rgba(0,0,0,.20);
    }

    .triangle.has-triangle-slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.18), rgba(0,0,0,.10));
      z-index: 1;
      pointer-events: none;
    }

    .triangle.has-triangle-slide::before {
      z-index: 2;
    }

    .triangle.has-triangle-slide span {
      position: absolute;
      left: 6px;
      bottom: 6px;
      z-index: 3;
      min-width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border-radius: 999px;
      color: #ffffff;
      background: rgba(55,35,28,.72);
      box-shadow: 0 3px 8px rgba(0,0,0,.22);
      font-size: 10px;
    }


    /*
      COPPIE DI TRIANGOLI.
      Ogni coppia occupa una cella-quadrato lasciata vuota dalla diagonale.
      Le due metà sono divise dalla diagonale della cella.
    */

    /* coppia 1: sopra-destra di q1 */
    .t1  { left: calc(var(--s) * 1.6); top: calc(var(--s) * 0.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(var(--s), var(--s)) rotateX(-110deg); }
    .t2  { left: calc(var(--s) * 1.6); top: calc(var(--s) * 0.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(var(--s), var(--s)) rotateY(-110deg); }

    /* coppia 2: sotto-sinistra di q2 */
    .t3  { left: calc(var(--s) * 0.6); top: calc(var(--s) * 1.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(var(--s), var(--s)) rotateY(110deg); }
    .t4  { left: calc(var(--s) * 0.6); top: calc(var(--s) * 1.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(var(--s), var(--s)) rotateX(-110deg); }

    /* coppia 3: sopra-destra di q2 */
    .t5  { left: calc(var(--s) * 2.6); top: calc(var(--s) * 1.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(0,0) rotateX(-110deg); }
    .t6  { left: calc(var(--s) * 2.6); top: calc(var(--s) * 1.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(0,0) rotateY(-110deg); }

    /* coppia 4: sotto-sinistra di q3 */
    .t7  { left: calc(var(--s) * 1.6); top: calc(var(--s) * 2.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(0,0) rotateY(110deg); }
    .t8  { left: calc(var(--s) * 1.6); top: calc(var(--s) * 2.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(0,0) rotateX(110deg); }

    /* coppia 5: sopra-destra di q3 */
    .t9  { left: calc(var(--s) * 3.6); top: calc(var(--s) * 2.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateX(110deg); }
    .t10 { left: calc(var(--s) * 3.6); top: calc(var(--s) * 2.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateY(-110deg); }

    /* coppia 6: sotto-sinistra di q4 */
    .t11 { left: calc(var(--s) * 2.6); top: calc(var(--s) * 3.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateY(110deg); }
    .t12 { left: calc(var(--s) * 2.6); top: calc(var(--s) * 3.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateX(110deg); }

    .book.open .triangle {
      transform: translate(0,0) rotateX(0) rotateY(0);
    }

    .cover {
      left: calc(var(--s) * 3);
      top: calc(var(--s) * 3);
      background: #f3a99e;
      background-image: url('carta rs.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 50;

      /* identico a prima + piccolo bordo bianco */
      border: 2px solid rgba(255,255,255,.78);

      box-shadow: 0 22px 36px rgba(0,0,0,.24);
    }

    .cover strong {
      font-size: 17px;
      text-transform: uppercase;
    }

    .book.open .cover {
      transform: scale(.55) translateZ(-100px) rotateZ(8deg);
      opacity: 0;
      pointer-events: none;
    }

    /*
      Stato chiuso pulito: si vede SOLO il quadrato di copertina.
      Tutti gli altri elementi compaiono solo quando l'explosion book si apre.
    */
    .book:not(.open) .square,
    .book:not(.open) .triangle {
      opacity: 0;
      pointer-events: none;
    }

    .book.open .square {
      opacity: 1;
    }


    /* Nasconde i cerchi e i numeri sui triangoli */
    .triangle span,
    .triangle.has-triangle-slide span {
      display: none !important;
    }


    /* Quadrati del book: frame bianco più spesso, uniforme ai triangoli */
    .has-slide,
    .has-slide-small {
      background: #ffffff !important;
      padding: 8px;
      overflow: hidden;
      border: 2px solid rgba(55,35,28,.55);
      box-shadow:
        inset 0 0 0 6px rgba(255,255,255,.95),
        0 12px 24px rgba(0,0,0,.16);
    }

    .has-slide img,
    .has-slide-small img {
      position: absolute;
      inset: 8%;
      width: 84%;
      height: 84%;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 0;
      border: 3px solid rgba(255,255,255,.96);
      box-shadow: 0 3px 8px rgba(0,0,0,.20);
    }

    .clickable-piece {
      cursor: pointer;
    }

    .clickable-piece:hover {
      filter: brightness(1.08);
    }

    .slide-viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.28);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity .16s ease;
      padding: 8px;
    }

    .slide-viewer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .slide-viewer img {
      position: relative;
      z-index: 10000;
      width: auto;
      max-width: 98vw;
      max-height: 96vh;
      object-fit: contain;
      background: white;
      padding: 4px;
      border: 2px solid rgba(255,255,255,.92);
      box-shadow: 0 18px 48px rgba(0,0,0,.36);
      display: block;
      margin: auto;
      transform: translateY(-12px);
    }

    .viewer-label {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0,0,0,.14);
      z-index: 10001;
    }

/*
      Quadrati ornamentali sullo sfondo.
      Non sono interattivi: servono solo a dare
      più presenza visiva all'explosion book.
    */
    .decor-square {
      position: fixed;
      width: 140px;
      height: 140px;
      border: 5px solid rgba(255,255,255,.82);
      background-color: rgba(255,255,255,.22);
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      transform: rotate(45deg);
      box-shadow:
        0 18px 38px rgba(0,0,0,.16),
        inset 0 0 0 2px rgba(255,255,255,.28);
      pointer-events: none;
      z-index: 120;
    }

    .decor1 {
      top: 8%;
      left: 6%;
      background-image: url('carta vi.jpg');
      background-size: cover;
      background-position: center;
    }

    .decor2 {
      bottom: 7%;
      right: 3%;
      width: 220px;
      height: 220px;
      opacity: 1;
      background-image: url('CG1.jpg');
      background-size: cover;
      background-position: center;
    }

    .decor3 {
      top: 30%;
      right: 24%;
      width: 110px;
      height: 110px;
      opacity: .82;
      background-image: url('carta bs.jpg');
      background-size: cover;
      background-position: center;
    }

    .decor4 {
      bottom: 16%;
      left: 18%;
      width: 135px;
      height: 135px;
      opacity: .78;
      background-image: url('carta ar.jpg');
      background-size: cover;
      background-position: center;
    }

    .decor5 {
      top: 42%;
      left: 10%;
      width: 95px;
      height: 95px;
      opacity: .74;
      background-image: url('carta ve.jpg');
      background-size: cover;
      background-position: center;
    }

    .decor6 {
      top: 5%;
      right: 12%;
      width: 155px;
      height: 155px;
      opacity: .8;
      background-image: url('carta ve c.jpg');
      background-size: cover;
      background-position: center;
    }


    /*
      Quando una slide è aperta, i quadrati ornamentali e l'explosion book
      passano visivamente in secondo piano. Le copertine restano intatte:
      cambia solo il livello/trasparenza durante la visualizzazione della slide.
    */
    body.slide-open .decor-square {
      z-index: 5;
      opacity: .28;
      filter: blur(1px) brightness(.75);
    }
body.slide-open .slide-viewer {
      z-index: 9999;
    }

    /* Stabilizza il click sui triangoli piccoli senza avanzamento automatico */
    .book.open .clickable-piece {
      pointer-events: auto;
    }

    .book.open .triangle.clickable-piece {
      z-index: 90;
    }

    .book.open .t5,
    .book.open .t7 {
      z-index: 120;
    }


    /* Performance: forza compositing e riduce ritardi di rendering */
    .book,
    .square,
    .triangle,
    .cover,
    .decor-square,
    .slide-viewer img {
      will-change: transform, opacity;
      transform-style: preserve-3d;
    }

    .decor-square,
    .square img,
    .triangle img,
    .cover {
      image-rendering: auto;
    }


    /* GitHub Pages: limita ritardi visivi mentre le immagini vengono scaricate */
    .decor-square,
    .triangle.has-triangle-slide,
    .has-slide,
    .has-slide-small {
      background-color: #ffffff;
    }


    /* Pop-up / pop-in: la slide parte dal suo quadrato/triangolo e rientra lì */
    .flying-slide {
      position: fixed;
      z-index: 10000;
      background: #ffffff;
      padding: 6px;
      border: 3px solid rgba(255,255,255,.94);
      box-shadow: 0 24px 70px rgba(0,0,0,.48);
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition:
        left .58s cubic-bezier(.22,.85,.18,1),
        top .58s cubic-bezier(.22,.85,.18,1),
        width .58s cubic-bezier(.22,.85,.18,1),
        height .58s cubic-bezier(.22,.85,.18,1),
        opacity .18s ease;
    }

    .flying-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
      display: block;
    }

    .flying-title {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0,0,0,.14);
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
    }

    .flying-title.visible {
      opacity: 1;
    }

@media (max-width: 760px) {
      .book { --s: 105px; }
      .square span, .triangle span { font-size: 9px; }
      .cover strong { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="decor-square decor1"></div>
  <div class="decor-square decor2"></div>
  <div class="decor-square decor3"></div>
  <div class="decor-square decor4"></div>
  <div class="decor-square decor5"></div>
  <div class="decor-square decor6"></div>

  <main class="scene">
    <section class="book" id="book" aria-label="Explosion book interattivo: quattro quadrati e dodici triangoli">
      <div class="cover"><strong>Storie<br>uniche</strong></div>

      <div class="square q1 has-slide-small clickable-piece" data-slide="1">
        <img fetchpriority="high" decoding="async" loading="eager" src="slide1.jpg" alt="Slide 1" />
      </div>

      <div class="square q2 has-slide-small clickable-piece" data-slide="2">
        <img fetchpriority="high" decoding="async" loading="eager" src="slide2.jpg" alt="Slide 2" />
      </div>

      <div class="square q3 has-slide clickable-piece" data-slide="3">
        <img fetchpriority="high" decoding="async" loading="eager" src="slide3.jpg" alt="Slide 3" />
      </div>

      <div class="square q4 has-slide-small clickable-piece" data-slide="4">
        <img fetchpriority="high" decoding="async" loading="eager" src="slide4.jpg" alt="Slide 4" />
      </div>

      <div class="triangle t1 has-triangle-slide clickable-piece" data-slide="6"><img fetchpriority="high" decoding="async" loading="eager" src="slide6.jpg" alt="Slide 6" /><span>6</span></div>
      <div class="triangle t2 has-triangle-slide clickable-piece" data-slide="8"><img fetchpriority="high" decoding="async" loading="eager" src="slide8.jpg" alt="Slide 8" /><span>8</span></div>

      <div class="triangle t3 has-triangle-slide clickable-piece" data-slide="5"><img fetchpriority="high" decoding="async" loading="eager" src="slide5.jpg" alt="Slide 5" /><span>5</span></div>
      <div class="triangle t4 has-triangle-slide clickable-piece" data-slide="7"><img fetchpriority="high" decoding="async" loading="eager" src="slide7.jpg" alt="Slide 7" /><span>7</span></div>

      <div class="triangle t5 has-triangle-slide clickable-piece" data-slide="10"><img fetchpriority="high" decoding="async" loading="eager" src="slide10.jpg" alt="Slide 10" /><span></span></div>
      <div class="triangle t6 has-triangle-slide"><img fetchpriority="high" decoding="async" loading="eager" src="CAR.jpg" alt="t6" /><span></span></div>

      <div class="triangle t7 has-triangle-slide clickable-piece" data-slide="9"><img fetchpriority="high" decoding="async" loading="eager" src="slide9.jpg" alt="Slide 9" /><span></span></div>

      <div class="triangle t8 has-triangle-slide clickable-piece" data-slide="11"><img fetchpriority="high" decoding="async" loading="eager" src="slide11.jpg" alt="Slide 11" /><span></span></div>

      <div class="triangle t9 has-triangle-slide"><img fetchpriority="high" decoding="async" loading="eager" src="CCC.jpg" alt="t9" /><span></span></div>
      <div class="triangle t10 has-triangle-slide"><img fetchpriority="high" decoding="async" loading="eager" src="CROS.jpg" alt="t10" /><span></span></div>

      <div class="triangle t11 has-triangle-slide"><img fetchpriority="high" decoding="async" loading="eager" src="CACQ.jpg" alt="t11" /><span></span></div>
      <div class="triangle t12 has-triangle-slide"><img fetchpriority="high" decoding="async" loading="eager" src="CG2.jpg" alt="t12" /><span></span></div>
    </section>

    <div class="slide-viewer" id="slideViewer" aria-hidden="true">
      <img fetchpriority="high" decoding="async" loading="eager" id="viewerImage" src="slide1.jpg" alt="Slide ingrandita" />
      <div class="viewer-label" id="viewerLabel">Slide 1</div>
    </div>
  </main>
<script>
    const book = document.getElementById('book');

    const slides = [
      'slide1.jpg',
      'slide2.jpg',
      'slide3.jpg',
      'slide4.jpg',
      'slide5.jpg',
      'slide6.jpg',
      'slide7.jpg',
      'slide8.jpg',
      'slide9.jpg',
      'slide10.jpg',
      'slide11.jpg'
    ];

    const titles = [
      'Intro',
      'Contesto, Criticità e Esigenze',
      'Contesto essenziale',
      'UDA e Obbiettivi',
      'Metodologie e Interventi',
      'Elaborato TIC',
      'Esempi visivi',
      'Risultati attesi',
      'Autovalutazione',
      'Conclusioni e Prospettive',
      'Ringraziamenti'
    ];

    const assets = [
      ...slides,
      'CAR.jpg',
      'CCC.jpg',
      'CROS.jpg',
      'CACQ.jpg',
      'CG2.jpg',
      'carta vi.jpg',
      'CG1.jpg',
      'carta bs.jpg',
      'carta ar.jpg',
      'carta ve.jpg',
      'carta ve c.jpg',
      'carta rs.jpg',
      'sfondo muro v.jpg'
    ];

    assets.forEach(src => {
      const img = new Image();
      img.decoding = 'async';
      img.loading = 'eager';
      img.src = src;
      if (img.decode) img.decode().catch(() => {});
    });

    let activeCard = null;
    let activeTitle = null;
    let activeStartRect = null;
    let activeSlideNumber = null;
    let isAnimating = false;
    let viewedSlides = new Set();
    let readyToCloseBook = false;

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function getPieceForSlide(slideNumber) {
      return document.querySelector(`[data-slide="${slideNumber}"]`) || book;
    }

    function getTargetRect() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const w = Math.min(vw * 0.90, 1040);
      const h = Math.min(vh * 0.86, 680);

      return {
        left: (vw - w) / 2,
        top: (vh - h) / 2,
        width: w,
        height: h
      };
    }

    function openBook() {
      requestAnimationFrame(() => {
        book.classList.add('open');
      });
    }

    function closeBook() {
      document.body.classList.remove('slide-open');
      book.classList.remove('open');
      activeCard?.remove();
      activeTitle?.remove();
      activeCard = null;
      activeTitle = null;
      activeStartRect = null;
      activeSlideNumber = null;
      isAnimating = false;
      viewedSlides.clear();
      readyToCloseBook = false;
    }

    async function openSlide(slideNumber) {
      const index = slideNumber - 1;
      const piece = getPieceForSlide(slideNumber);
      const start = piece.getBoundingClientRect();
      const target = getTargetRect();

      activeStartRect = start;
      activeSlideNumber = slideNumber;
      document.body.classList.add('slide-open');

      const title = document.createElement('div');
      title.className = 'flying-title';
      title.textContent = titles[index] || `Slide ${slideNumber}`;
      document.body.appendChild(title);

      const card = document.createElement('div');
      card.className = 'flying-slide';
      card.style.left = `${start.left}px`;
      card.style.top = `${start.top}px`;
      card.style.width = `${Math.max(start.width, 30)}px`;
      card.style.height = `${Math.max(start.height, 30)}px`;

      const img = document.createElement('img');
      img.src = slides[index];
      img.alt = titles[index] || `Slide ${slideNumber}`;
      card.appendChild(img);

      document.body.appendChild(card);

      activeCard = card;
      activeTitle = title;

      await wait(30);

      title.classList.add('visible');
      card.style.opacity = '1';
      card.style.left = `${target.left}px`;
      card.style.top = `${target.top}px`;
      card.style.width = `${target.width}px`;
      card.style.height = `${target.height}px`;
    }

    async function closeSlide() {
      if (!activeCard || !activeStartRect) return;

      activeCard.style.left = `${activeStartRect.left}px`;
      activeCard.style.top = `${activeStartRect.top}px`;
      activeCard.style.width = `${Math.max(activeStartRect.width, 30)}px`;
      activeCard.style.height = `${Math.max(activeStartRect.height, 30)}px`;
      activeCard.style.opacity = '0';
      activeTitle?.classList.remove('visible');

      await wait(620);

      if (activeSlideNumber) {
        viewedSlides.add(activeSlideNumber);

        // Dopo che la slide 11 / Ringraziamenti rientra,
        // il click successivo richiude il book.
        if (activeSlideNumber === 11) {
          readyToCloseBook = true;
        }
      }

      activeCard.remove();
      activeTitle?.remove();
      activeCard = null;
      activeTitle = null;
      activeStartRect = null;
      activeSlideNumber = null;
      document.body.classList.remove('slide-open');
    }

    async function toggleSlide(slideNumber) {
      if (isAnimating) return;
      isAnimating = true;

      if (!book.classList.contains('open')) {
        openBook();
        await wait(520);
      }

      if (activeCard) {
        await closeSlide();
      } else {
        await openSlide(slideNumber);
      }

      isAnimating = false;
    }

    /*
      Click sulla copertina:
      - se il book è chiuso, lo apre;
      - se tutte le 11 slide sono state aperte e richiuse, lo chiude.
    */
    book.addEventListener('click', async (e) => {
      if (e.target.closest('.clickable-piece')) return;
      if (isAnimating) return;

      if (!book.classList.contains('open')) {
        isAnimating = true;
        openBook();
        await wait(520);
        isAnimating = false;
        return;
      }

      if (!activeCard && readyToCloseBook) {
        closeBook();
      }
    });

    /*
      Click sui pezzi del book:
      - clicchi il quadrato/triangolo della slide;
      - la slide esce da quel pezzo;
      - riclicchi sulla slide grande per farla rientrare nello stesso pezzo.
    */
    document.querySelectorAll('.clickable-piece').forEach(piece => {
      piece.addEventListener('click', (e) => {
        e.stopPropagation();
        const n = Number(piece.dataset.slide);
        if (n) toggleSlide(n);
      });
    });

    /*
      Click sulla slide aperta: rientra nel suo quadrato/triangolo.
    */
    document.addEventListener('click', (e) => {
      if (!activeCard || isAnimating) return;
      if (e.target.closest('.flying-slide')) {
        e.stopPropagation();
        isAnimating = true;
        closeSlide().then(() => {
          isAnimating = false;
        });
      }
    });


    /*
      Click finale di sicurezza:
      dopo che tutte le 11 slide sono state aperte e richiuse,
      un click su qualunque punto libero richiude l'explosion book.
    */
    document.addEventListener('click', (e) => {
      if (isAnimating) return;
      if (activeCard) return;
      if (!book.classList.contains('open')) return;
      if (e.target.closest('.clickable-piece')) return;

      if (readyToCloseBook) {
        closeBook();
      }
    });

    document.addEventListener('keydown', async (e) => {
      if (e.code === 'Escape') {
        if (activeCard) {
          isAnimating = true;
          await closeSlide();
          isAnimating = false;
        } else {
          closeBook();
        }
      }

      if (e.code === 'Space' || e.code === 'ArrowRight') {
        e.preventDefault();
        if (!book.classList.contains('open')) {
          isAnimating = true;
          openBook();
          await wait(520);
          isAnimating = false;
        }
      }
    });
  </script>
</body>
</html>
