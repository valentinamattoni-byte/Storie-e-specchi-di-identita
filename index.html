<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explosion Book - presentazione interattiva</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --s: min(14vw, 130px);
      --paper-border: rgba(55, 35, 28, .82);
    }

    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #efd8cf;
      background-image: url('sfondo muro v.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .scene {
      width: min(96vw, 1200px);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1800px;
      position: relative;
      z-index: 20;
    }

    .book {
      width: calc(var(--s) * 6.2);
      height: calc(var(--s) * 6.2);
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform .85s ease, opacity .35s ease, filter .35s ease;
      will-change: transform, opacity, filter;
      z-index: 30;
    }

    .book.open {
      transform: scale(1.06) rotateX(3deg) rotateZ(-2deg) translateX(-2vw);
    }

    .square,
    .triangle,
    .cover {
      position: absolute;
      width: var(--s);
      height: var(--s);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0;
      border: 3px solid var(--paper-border);
      box-shadow: 0 12px 24px rgba(0,0,0,.16);
      backface-visibility: hidden;
      overflow: hidden;
      transition: transform .95s cubic-bezier(.2,.75,.15,1), opacity .35s ease;
      will-change: transform, opacity;
    }

    .square::after,
    .triangle::after,
    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.24), rgba(0,0,0,.06));
      pointer-events: none;
      z-index: 4;
    }

    .square img {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: white;
      padding: 2px;
    }

    .has-slide,
    .has-slide-small {
      background: white !important;
      overflow: hidden;
      padding: 0;
    }

    .has-slide img,
    .has-slide-small img {
      box-shadow: 0 6px 16px rgba(0,0,0,.18);
    }

    .book.open .has-slide {
      transform: translate(0,0) rotateX(0) rotateY(0) scale(1.12);
      z-index: 35;
    }

    .q1 { left: calc(var(--s) * 0.6); top: calc(var(--s) * 0.6); background: #ffe29a; z-index: 20; }
    .q2 { left: calc(var(--s) * 1.6); top: calc(var(--s) * 1.6); background: #d8f0ff; z-index: 22; }
    .q3 { left: calc(var(--s) * 2.6); top: calc(var(--s) * 2.6); background: #f5b7aa; z-index: 24; }
    .q4 { left: calc(var(--s) * 3.6); top: calc(var(--s) * 3.6); background: #d9f4df; z-index: 26; }

    .q1 { transform-origin: 100% 100%; transform: translate(calc(var(--s) * 2), calc(var(--s) * 2)) rotateX(-130deg) rotateY(35deg); }
    .q2 { transform-origin: 100% 100%; transform: translate(var(--s), var(--s)) rotateX(-120deg) rotateY(25deg); }
    .q3 { transform: translate(0,0); }
    .q4 { transform-origin: 0% 0%; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateX(120deg) rotateY(-25deg); }

    .book.open .q1,
    .book.open .q2,
    .book.open .q3,
    .book.open .q4 {
      transform: translate(0,0) rotateX(0) rotateY(0);
    }

    .triangle {
      background: rgba(255,248,237,.9);
      opacity: 0;
      z-index: 18;
      border: 1.5px solid rgba(70, 45, 35, .58);
    }

    .triangle::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
        transparent calc(50% - .5px),
        rgba(70,45,35,.34) calc(50% - .5px),
        rgba(70,45,35,.34) calc(50% + .5px),
        transparent calc(50% + .5px)
      );
      z-index: 5;
      pointer-events: none;
    }

    .book.open .triangle { opacity: 1; }

    .triangle span {
      position: absolute;
      left: 6px;
      bottom: 6px;
      z-index: 6;
      min-width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border-radius: 999px;
      color: white;
      background: rgba(55,35,28,.74);
      box-shadow: 0 3px 8px rgba(0,0,0,.24);
      font-size: 10px;
      font-weight: bold;
    }

    .triangle.has-triangle-slide {
      background: white;
      overflow: hidden;
    }

    .triangle.has-triangle-slide img {
      position: absolute;
      inset: -18%;
      width: 136%;
      height: 136%;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 2;
      filter: saturate(1.05) contrast(1.03);
    }

    /* triangoli: coppie che formano i quadrati vuoti */
    .t1  { left: calc(var(--s) * 1.6); top: calc(var(--s) * 0.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(var(--s), var(--s)) rotateX(-110deg); }
    .t2  { left: calc(var(--s) * 1.6); top: calc(var(--s) * 0.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(var(--s), var(--s)) rotateY(-110deg); }
    .t3  { left: calc(var(--s) * 0.6); top: calc(var(--s) * 1.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(var(--s), var(--s)) rotateY(110deg); }
    .t4  { left: calc(var(--s) * 0.6); top: calc(var(--s) * 1.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(var(--s), var(--s)) rotateX(-110deg); }
    .t5  { left: calc(var(--s) * 2.6); top: calc(var(--s) * 1.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(0,0) rotateX(-110deg); }
    .t6  { left: calc(var(--s) * 2.6); top: calc(var(--s) * 1.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(0,0) rotateY(-110deg); }
    .t7  { left: calc(var(--s) * 1.6); top: calc(var(--s) * 2.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(0,0) rotateY(110deg); }
    .t8  { left: calc(var(--s) * 1.6); top: calc(var(--s) * 2.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(0,0) rotateX(110deg); }
    .t9  { left: calc(var(--s) * 3.6); top: calc(var(--s) * 2.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateX(110deg); }
    .t10 { left: calc(var(--s) * 3.6); top: calc(var(--s) * 2.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateY(-110deg); }
    .t11 { left: calc(var(--s) * 2.6); top: calc(var(--s) * 3.6); clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 100%; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateY(110deg); }
    .t12 { left: calc(var(--s) * 2.6); top: calc(var(--s) * 3.6); clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: 100% 0; transform: translate(calc(var(--s) * -1), calc(var(--s) * -1)) rotateX(110deg); }

    .book.open .triangle { transform: translate(0,0) rotateX(0) rotateY(0); }

    .cover {
      left: calc(var(--s) * 3);
      top: calc(var(--s) * 3);
      background: #f3a99e;
      background-image: url('carta rs.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 50;
      box-shadow: 0 22px 36px rgba(0,0,0,.24);
    }

    .cover strong {
      position: relative;
      z-index: 6;
      font-size: 17px;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .book.open .cover {
      transform: scale(.55) translateZ(-100px) rotateZ(8deg);
      opacity: 0;
      pointer-events: none;
    }

    .book:not(.open) .square,
    .book:not(.open) .triangle {
      opacity: 0;
      pointer-events: none;
    }

    .book.open .square { opacity: 1; }

    .clickable-piece { cursor: pointer; }
    .clickable-piece:hover { filter: brightness(1.08); }

    .slide-viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity .25s ease;
    }

    .slide-viewer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .slide-viewer img {
      position: relative;
      z-index: 10000;
      max-width: 88vw;
      max-height: 88vh;
      object-fit: contain;
      background: white;
      padding: 10px;
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
    }

    .viewer-label {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      font-weight: bold;
      box-shadow: 0 8px 22px rgba(0,0,0,.16);
      z-index: 10001;
    }

    .decor-square {
      position: fixed;
      width: 140px;
      height: 140px;
      border: 5px solid rgba(255,255,255,.82);
      background-color: rgba(255,255,255,.22);
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      transform: rotate(45deg);
      box-shadow: 0 18px 38px rgba(0,0,0,.16), inset 0 0 0 2px rgba(255,255,255,.28);
      pointer-events: none;
      z-index: 120;
      transition: opacity .25s ease, filter .25s ease, z-index .25s ease;
      will-change: opacity, filter;
    }

    .decor1 { top: 8%; left: 6%; background-image: url('carta vi.jpg'); }
    .decor2 { bottom: 7%; right: 3%; width: 220px; height: 220px; opacity: .92; background-image: url('carta az.jpg'); }
    .decor3 { top: 30%; right: 24%; width: 110px; height: 110px; opacity: .82; background-image: url('carta bs.jpg'); }
    .decor4 { bottom: 16%; left: 18%; width: 135px; height: 135px; opacity: .78; background-image: url('carta ar.jpg'); }
    .decor5 { top: 42%; left: 10%; width: 95px; height: 95px; opacity: .74; background-image: url('carta ve.jpg'); }
    .decor6 { top: 5%; right: 12%; width: 155px; height: 155px; opacity: .8; background-image: url('carta ve c.jpg'); }

    body.slide-open .decor-square {
      z-index: 5;
      opacity: .24;
      filter: blur(.7px) brightness(.75);
    }

    body.slide-open .book {
      z-index: 10;
      opacity: .24;
      filter: brightness(.72);
      pointer-events: none;
    }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.84);
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 22px rgba(0,0,0,.13);
      font-size: 14px;
      z-index: 300;
    }

    @media (max-width: 760px) {
      :root { --s: 92px; }
      .cover strong { font-size: 12px; }
      .triangle span { font-size: 9px; min-width: 18px; height: 18px; }
    }
  </style>
</head>
<body>
  <div class="decor-square decor1"></div>
  <div class="decor-square decor2"></div>
  <div class="decor-square decor3"></div>
  <div class="decor-square decor4"></div>
  <div class="decor-square decor5"></div>
  <div class="decor-square decor6"></div>

  <main class="scene">
    <section class="book" id="book" aria-label="Explosion book interattivo: quattro quadrati e dodici triangoli">
      <div class="cover"><strong>Storie<br>uniche</strong></div>

      <div class="square q1 has-slide-small clickable-piece" data-slide="1"><img src="slide1.jpg" alt="Slide 1" decoding="async" /></div>
      <div class="square q2 has-slide-small clickable-piece" data-slide="2"><img src="slide2.jpg" alt="Slide 2" decoding="async" /></div>
      <div class="square q3 has-slide clickable-piece" data-slide="3"><img src="slide3.jpg" alt="Slide 3" decoding="async" /></div>
      <div class="square q4 has-slide-small clickable-piece" data-slide="4"><img src="slide4.jpg" alt="Slide 4" decoding="async" /></div>

      <div class="triangle t1 has-triangle-slide clickable-piece" data-slide="6"><img src="slide6.jpg" alt="Slide 6" decoding="async" /><span>6</span></div>
      <div class="triangle t2 has-triangle-slide clickable-piece" data-slide="8"><img src="slide8.jpg" alt="Slide 8" decoding="async" /><span>8</span></div>
      <div class="triangle t3 has-triangle-slide clickable-piece" data-slide="5"><img src="slide5.jpg" alt="Slide 5" decoding="async" /><span>5</span></div>
      <div class="triangle t4 has-triangle-slide clickable-piece" data-slide="7"><img src="slide7.jpg" alt="Slide 7" decoding="async" /><span>7</span></div>
      <div class="triangle t5 has-triangle-slide clickable-piece" data-slide="10"><img src="slide10.jpg" alt="Slide 10" decoding="async" /><span>10</span></div>
      <div class="triangle t6"><span></span></div>
      <div class="triangle t7 has-triangle-slide clickable-piece" data-slide="9"><img src="slide9.jpg" alt="Slide 9" decoding="async" /><span>9</span></div>
      <div class="triangle t8"><span></span></div>
      <div class="triangle t9"><span></span></div>
      <div class="triangle t10"><span></span></div>
      <div class="triangle t11"><span></span></div>
      <div class="triangle t12"><span></span></div>
    </section>

    <div class="slide-viewer" id="slideViewer" aria-hidden="true">
      <img id="viewerImage" src="slide1.jpg" alt="Slide ingrandita" />
      <div class="viewer-label" id="viewerLabel">Slide 1</div>
    </div>
  </main>

  <div class="hint">Clicca per aprire l’explosion book · clicca la slide grande per chiuderla</div>

  <script>
    const book = document.getElementById('book');
    const viewer = document.getElementById('slideViewer');
    const viewerImage = document.getElementById('viewerImage');
    const viewerLabel = document.getElementById('viewerLabel');
    const pieces = document.querySelectorAll('.clickable-piece');

    const slides = [
      'slide1.jpg', 'slide2.jpg', 'slide3.jpg', 'slide4.jpg', 'slide5.jpg',
      'slide6.jpg', 'slide7.jpg', 'slide8.jpg', 'slide9.jpg', 'slide10.jpg'
    ];

    let lastOpenedSlide = 0;

    function preloadSlides() {
      slides.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    }

    function openBook() {
      book.classList.add('open');
      preloadSlides();
    }

    function closeBook() {
      viewer.classList.remove('visible');
      document.body.classList.remove('slide-open');
      book.classList.remove('open');
      lastOpenedSlide = 0;
    }

    function showSlide(n) {
      const index = n - 1;
      if (!slides[index]) return;

      lastOpenedSlide = n;
      viewerImage.src = slides[index];
      viewerImage.alt = `Slide ${n}`;
      viewerLabel.textContent = `Slide ${n}`;
      document.body.classList.add('slide-open');
      viewer.classList.add('visible');

      if (n === 10) {
        setTimeout(() => {
          viewer.classList.remove('visible');
          document.body.classList.remove('slide-open');
          setTimeout(closeBook, 450);
        }, 1800);
      }
    }

    book.addEventListener('click', () => {
      if (!book.classList.contains('open')) openBook();
    });

    pieces.forEach(piece => {
      piece.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!book.classList.contains('open')) openBook();
        showSlide(Number(piece.dataset.slide));
      });
    });

    viewer.addEventListener('click', () => {
      viewer.classList.remove('visible');
      document.body.classList.remove('slide-open');
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowRight') {
        e.preventDefault();
        if (!book.classList.contains('open')) {
          openBook();
          return;
        }
        showSlide(Math.min((lastOpenedSlide || 0) + 1, 10));
      }

      if (e.code === 'Escape') {
        viewer.classList.remove('visible');
        document.body.classList.remove('slide-open');
      }
    });
  </script>
</body>
</html>
